[workspace]
members = ["crates/*"]

[package]
name = "simpletui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
cpal = "0.18"
crossbeam-channel = "0.5"
midir = "0.11"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
