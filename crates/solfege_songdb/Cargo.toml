[package]
name = "solfege_songdb"
version = "0.1.0"
edition = "2024"
description = "Song catalogue over NCN libraries and .sfkar folders, with search, favourites and play history"

[dependencies]
solfege_ncnparser = { path = "../solfege_ncnparser" }
solfege_sfkar = { path = "../solfege_sfkar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
