[package]
name = "solfege_sfkar"
version = "0.1.0"
edition = "2024"
description = "The .sfkar karaoke song format: one file with the backing MIDI, timed lyrics and song details"

[dependencies]
solfege_ncnparser = { path = "../solfege_ncnparser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
