[package]
name = "liveinst"
version = "0.1.0"
edition = "2024"
description = "Terminal instrument rack (WAV sampler, SFZ, SF2) with MIDI I/O and a web UI"

[[bin]]
name = "simpletui"
path = "src/main.rs"

[dependencies]
solfege_synth = { path = "../../crates/solfege_synth" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
crossbeam-channel = "0.5"
midir = "0.11"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
