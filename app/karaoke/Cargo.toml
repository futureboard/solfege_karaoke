[package]
name = "karaoke"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/futureboard/solfege_karaoke"
description = "Karaoke player (NCN and .sfkar songs) with an egui front end"

[[bin]]
name = "solfege-karaoke"
path = "src/main.rs"

[dependencies]
solfege_ncnparser = { path = "../../crates/solfege_ncnparser" }
solfege_sfkar = { path = "../../crates/solfege_sfkar" }
solfege_songdb = { path = "../../crates/solfege_songdb" }
solfege_synth = { path = "../../crates/solfege_synth" }
anyhow = "1"
crossbeam-channel = "0.5"
midir = "0.11"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "links", "wgpu", "wayland", "x11", "persistence"] }
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
pollster = "0.4"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
skrifa = "0.44"
